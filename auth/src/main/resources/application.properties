spring.application.name=auth-service

# Banco de Dados
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Servidor
server.port=8082

# JWT
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:/home/jos-vitor/StockVision/auth/keys/private.pem}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:/home/jos-vitor/StockVision/auth/keys/public.pem}
app.jwt.expiration-ms=900000
app.internal.token=${INTERNAL_API_TOKEN:stockvision-dev-internal-api-token-2026}
